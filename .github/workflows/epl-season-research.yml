name: EPL 2026-27 data research

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: "Discover verified club IDs (offline), or fetch player candidates (live Wikidata)"
        required: true
        default: discover_teams
        options:
          - discover_teams
          - discover_players
      club_id:
        type: string
        description: "For discover_players, a mapped club ID (default Arsenal)"
        required: false
        default: club_arsenal

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FOOTY_MODE: ${{ inputs.mode }}
      FOOTY_CLUB: ${{ inputs.club_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests and capture diagnostics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p data/staging/epl-2026-27
          npm test 2>&1 | tee data/staging/epl-2026-27/test.log
          npm run qa 2>&1 | tee data/staging/epl-2026-27/qa.log
      - name: Collect reusable research candidates
        shell: bash
        run: |
          set -o pipefail
          node scripts/research-epl-2026-27.js --mode="$FOOTY_MODE" --club="$FOOTY_CLUB" --out=data/staging/epl-2026-27 2>&1 | tee data/staging/epl-2026-27/export.log
      - name: Upload output and troubleshooting logs (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epl-2026-27-research-${{ inputs.mode }}
          path: data/staging/epl-2026-27/
          if-no-files-found: warn
          retention-days: 7
