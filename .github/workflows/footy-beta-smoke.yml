name: FOOTY hosted beta smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/smoke-beta.mjs'
      - '.github/workflows/footy-beta-smoke.yml'
      - 'supabase/functions/footy-beta/**'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run curated source regression tests
        run: |
          npm test
          npm run qa
      - name: Verify live Supabase function and 7 complete rounds
        run: node scripts/smoke-beta.mjs
