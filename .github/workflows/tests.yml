name: FOOTY test suite
on:
  pull_request:
  push:
    branches:
      - main
      - feature/v0.1.14-match-engine
      - feature/v0.1.15-gameplay-ux
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''
      - name: Run unit tests
        run: npm test
